name: Build jailbreak packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package target
        required: true
        default: roothide
        type: choice
        options:
          - all
          - rootless
          - roothide
          - rootful
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build dependencies
        run: |
          brew install dpkg ldid
          xcrun --sdk iphoneos --show-sdk-path
          dpkg-deb --version
          ldid -h >/dev/null 2>&1 || true

      - name: Build packages
        shell: bash
        env:
          DISPATCH_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          case "$DISPATCH_TARGET" in
            all) make deb ;;
            rootless) make deb-rootless ;;
            roothide) make deb-roothide ;;
            rootful) make deb-rootful ;;
            *) echo "Unsupported target: $DISPATCH_TARGET" >&2; exit 1 ;;
          esac

      - name: List packages
        run: |
          set -euo pipefail
          find build/deb -maxdepth 1 -type f -name '*.deb' -print
          test -n "$(find build/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Prepare OTA engine
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'rootless'
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^VERSION/{print $3; exit}' Makefile)
          deb="build/deb/com.iosdecrypthub_${version}_rootless.deb"
          extract_dir=$(mktemp -d)
          trap 'rm -rf "$extract_dir"' EXIT
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${version}"
          fi
          dpkg-deb -x "$deb" "$extract_dir"
          cp "$extract_dir/var/jb/usr/lib/IOSDecryptHub/decrypt_helper.dylib" \
            "build/deb/decrypt_helper-${version}.dylib"
          test -s "build/deb/decrypt_helper-${version}.dylib"

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: iosdecrypthub-deb-${{ github.run_id }}
          path: |
            build/deb/*.deb
            build/deb/decrypt_helper-*.dylib
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(build/deb/*.deb build/deb/decrypt_helper-*.dylib)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
